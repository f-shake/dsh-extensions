# typo-proof 的 Loader 行。
#
# 这里只放**通用默认值**：数字参数这类跟机器无关的东西。文件路径、provider、
# 模型名一律不写死——它们是每台机器自己的事，写进仓库等于把别人的路径和模型名
# 带进 git 历史。
#
# 面板右上角「设置」里改的值存在 ~/.dsh/typo-proof/settings.json（本机用户目录，
# 不进仓库），优先级高于这里的值，保存即刻生效、不用重启。
- insert:
    - id: typo-proof
      name: '@local/typo-proof'
      config:
        minHanzi: 8
        samples: 3
        concurrency: 3
