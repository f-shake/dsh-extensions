# ============================================================================
# dsn.example.com —— 贴到 VPS(Windows) 的 nginx 配置
#
# 链路：浏览器 → VPS nginx:443 → 127.0.0.1:12315(隧道) → nas-host:8791(dsh)
#                              → 127.0.0.1:12318(隧道) → nas-host:8099(dsh-auth)
#
# 使用前必须改两处（其余可原样贴）：
#   1. <CERT_PATH> / <KEY_PATH>：从现有 example.com 的 443 server 块里抄
#   2. 如果 VPS 上已有 `limit_req_zone ... zone=applogin` 之类的同名 zone，
#      本文件用的是 login_limit，不冲突；但整段 http 级指令只能出现一次。
#
# 检查：nginx.exe -t -p "<NGINX_DIR>/" -c "<NGINX_DIR>/conf/nginx.conf"
# 生效：nginx.exe -s reload -p "<NGINX_DIR>/"
#
# 三个前置条件，缺一个都会在 reload 时报错或线上 500：
#   a) http 段必须有 connection_upgrade 的 map（否则 unknown "connection_upgrade" variable）
#        map $http_upgrade $connection_upgrade { default upgrade; '' ""; }
#   b) 必须有 default_server 兜底块，否则未列出的域名会串到第一个 server（421/证书错）
#        server { listen 443 ssl default_server; server_name _; ssl_certificate ...; return 421; }
#   c) 本文件里 limit_req_zone 那一行属于 http 段，不能贴在 server 块内部
# ============================================================================

# ---- http 级（放在 nginx.conf 的 http { } 里面，与其它 limit_req_zone 并列）----
# 登录限流：5 次/分，突发 3。公网 IP 在 VPS 上才是真实客户端地址，所以这层限流有效。
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_status 429;

# ---- 80：只做跳转，不提供任何内容 ----
server {
    listen 80;
    server_name dsn.example.com;
    return 301 https://$host$request_uri;
}

# ---- 443：真正的入口 ----
server {
    listen 443 ssl;
    server_name dsn.example.com;

    ssl_certificate     <CERT_PATH>;
    ssl_certificate_key <KEY_PATH>;

    # dsh 传附件/截图会走这里
    client_max_body_size 500M;

    # ---------- 认证子请求：cookie 校验（内网服务判定）----------
    location = /_app_auth {
        internal;
        access_log off;
        proxy_pass http://127.0.0.1:12318/check-cookie;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_read_timeout 10s;
    }

    # ---------- 登录提交：POST 表单，转到内网 /auth ----------
    # 注意这里必须带 X-Forwarded-Proto，否则 dsh-auth 认为不是 HTTPS，
    # 下发的会话 cookie 就不会带 Secure 标记。
    location = /_app_login {
        limit_req zone=login_limit burst=3 nodelay;
        access_log off;
        proxy_pass http://127.0.0.1:12318/auth;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # 未认证时跳登录页（登录页自身必须免认证，否则死循环）
    location @login_redirect { return 302 /login.html; }

    location = /login.html {
        access_log off;
        proxy_pass http://127.0.0.1:12318/login-page;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # 注销（可选，但有了方便换设备）
    location = /_app_logout {
        proxy_pass http://127.0.0.1:12318/logout;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 应用本体 ----------
    location / {
        auth_request /_app_auth;
        error_page 401 = @login_redirect;

        proxy_pass http://127.0.0.1:12315;
        proxy_http_version 1.1;

        # dsh 0.2.x 要求原样透传浏览器看到的 Host（0.1.x 正好相反，别照抄旧配置）。
        # 这条同时决定 dsh 签发 cookie 的 authority。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / 事件流
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
